<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | FA Digital Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#222}
header{background:#172554;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{font-size:23px;margin:0}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:white;text-decoration:none;font-weight:bold}
.container{max-width:1050px;margin:35px auto;padding:0 16px}
.back{display:inline-block;margin-bottom:20px;color:#1d4ed8;text-decoration:none;font-weight:bold}
.details{background:white;border-radius:16px;padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:30px;box-shadow:0 5px 25px #0000000d}
.image-box{background:#f8fafc;border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:330px}
.image-box img{width:100%;height:420px;object-fit:contain;border-radius:10px}
.category{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:7px 12px;border-radius:20px;font-size:13px}
h2{font-size:28px;margin:16px 0}
.price{font-size:27px;color:#15803d;font-weight:bold;margin:18px 0}
.description{line-height:1.8;color:#555;white-space:pre-line}
.quantity{display:flex;align-items:center;gap:12px;margin:22px 0}
.quantity button{width:38px;height:38px;border:1px solid #ddd;background:white;border-radius:7px;font-size:20px;cursor:pointer}
.quantity input{width:55px;height:38px;text-align:center;border:1px solid #ddd;border-radius:7px;font-size:16px}
.add-btn{background:#16a34a;color:white;border:0;border-radius:8px;padding:15px 22px;font-size:16px;font-weight:bold;cursor:pointer;width:100%}
.add-btn:hover{background:#15803d}
.message{text-align:center;padding:45px;background:white;border-radius:12px}
footer{text-align:center;padding:25px;color:#666}
@media(max-width:700px){header{padding:16px}header h1{font-size:20px}.details{grid-template-columns:1fr;padding:16px;gap:18px}.image-box{min-height:250px}.image-box img{height:300px}h2{font-size:23px}.container{margin:20px auto}}
</style>
</head>
<body>
<header>
<h1>FA Digital Store</h1>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart 🛒 <span id="cartCount">0</span></a>
</nav>
</header>

<main class="container">
<a class="back" href="shop.html">← Back to Shop</a>
<div id="productDetails" class="message">Loading product details...</div>
</main>

<footer>© FA Digital Store</footer>

<script>
const params=new URLSearchParams(location.search);
const productId=params.get("id");
let selectedProduct=null;

function getCart(){
  try{return JSON.parse(localStorage.getItem("cart"))||[]}
  catch{return []}
}
function updateCartBadge(){
  const count=getCart().reduce((sum,item)=>sum+(parseInt(item.quantity)||1),0);
  document.getElementById("cartCount").textContent=count;
}
function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function addProductToCart(){
  if(!selectedProduct)return;
  const quantity=Math.max(1,Math.min(99,parseInt(document.getElementById("quantity").value)||1));
  const cart=getCart();
  const existing=cart.find(item=>
    (item.productId!=null && String(item.productId)===String(selectedProduct.id)) ||
    ((item.productId==null) && (item.title===selectedProduct.name || item.name===selectedProduct.name))
  );
  if(existing){
    existing.quantity=Math.min(99,(parseInt(existing.quantity)||1)+quantity);
  }else{
    cart.push({
      productId:selectedProduct.id,
      title:selectedProduct.name,
      name:selectedProduct.name,
      price:Number(selectedProduct.price)||0,
      quantity:quantity,
      image:selectedProduct.image||""
    });
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCartBadge();
  alert("Product added to cart successfully! 🛒");
}
async function loadProduct(){
  const container=document.getElementById("productDetails");
  if(!productId){
    container.innerHTML='<h2>Product not selected</h2><p>Please select a product from the shop.</p><a href="shop.html">Browse Products</a>';
    return;
  }
  try{
    const response=await fetch("/api/products");
    if(!response.ok)throw new Error("Products could not be loaded");
    const products=await response.json();
    selectedProduct=products.find(p=>String(p.id)===String(productId));
    if(!selectedProduct){
      container.innerHTML='<h2>Product not found</h2><p>This product may no longer be available.</p><a href="shop.html">Back to Shop</a>';
      return;
    }
    const name=escapeHTML(selectedProduct.name||"Product");
    const category=escapeHTML(selectedProduct.category||"General");
    const description=escapeHTML(selectedProduct.description||"Quality product from FA Digital Store. Contact us if you need more information.");
    const image=escapeHTML(selectedProduct.image||"https://placehold.co/600x600/png?text=Product");
    const price=Number(selectedProduct.price)||0;
    container.className="details";
    container.innerHTML=`
      <div class="image-box">
        <img src="${image}" alt="${name}" onerror="this.onerror=null;this.src='https://placehold.co/600x600/png?text=Product'">
      </div>
      <section class="product-info">
        <span class="category">${category}</span>
        <h2>${name}</h2>
        <div class="price">Rs. ${price.toLocaleString("en-PK")}</div>
        <p class="description">${description}</p>
        <div class="quantity">
          <strong>Quantity:</strong>
          <button type="button" onclick="changeQuantity(-1)" aria-label="Decrease quantity">−</button>
          <input id="quantity" type="number" min="1" max="99" value="1">
          <button type="button" onclick="changeQuantity(1)" aria-label="Increase quantity">+</button>
        </div>
        <button class="add-btn" onclick="addProductToCart()">🛒 Add to Cart</button>
      </section>`;
  }catch(error){
    console.error(error);
    container.className="message";
    container.innerHTML='<h2>Unable to load product</h2><p>Please check your internet connection and try again.</p><a href="shop.html">Back to Shop</a>';
  }
}
function changeQuantity(change){
  const input=document.getElementById("quantity");
  if(!input)return;
  input.value=Math.max(1,Math.min(99,(parseInt(input.value)||1)+change));
}
updateCartBadge();
loadProduct();
</script>
</body>
</html>
