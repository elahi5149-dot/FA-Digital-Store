<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - FA Digital Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        header { background: #1e293b; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 1000; }
        header h1 { color: #38bdf8; font-size: 24px; font-weight: 700; }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 20px; font-size: 15px; font-weight: 500; }
        nav a:hover { color: #38bdf8; }
        .cart-badge { background: #38bdf8; color: #0f172a; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 13px; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 10px; font-size: 28px; }
        .section-subtitle { text-align: center; color: #94a3b8; font-size: 15px; margin-bottom: 35px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .product-card:hover { border-color: #38bdf8; transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .product-img { width: 100%; height: 210px; object-fit: cover; background: #0f172a; }
        .product-info { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .badge { background: #ef4444; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; align-self: flex-start; }
        .product-title { font-size: 17px; font-weight: bold; color: #f8fafc; margin-bottom: 8px; }
        .rating { color: #f59e0b; font-size: 14px; margin-bottom: 10px; }
        .price-box { font-size: 19px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; }
        .old-price { text-decoration: line-through; color: #64748b; font-size: 14px; margin-left: 8px; }
        .add-btn { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .add-btn:hover { background: #0369a1; }
    </style>


<style>
.filter-btn {
    padding: 10px 18px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #222;
    color: #fff;
    cursor: pointer;
}
.filter-btn:hover,
.filter-btn.active {
    background: #2563eb;
    border-color: #2563eb;
}
</style>

<style>
/* ===== FA DIGITAL STORE - CENTERED MOBILE DESIGN ===== */
body{
    background:#071a33;
    color:#f8fafc;
}

header{
    background:#0b1f3a;
    padding:18px 4%;
    min-height:95px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    color:#20b9ff;
    font-size:30px;
    text-align:center;
}

nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

nav a{
    color:#e2e8f0;
    margin-left:0;
    font-size:16px;
    text-align:center;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 18px;
}

h2{
    color:#20b9ff;
    text-align:center;
    font-size:30px;
    margin-bottom:8px;
}

.section-subtitle{
    text-align:center;
    color:#b8c7d9;
    margin-bottom:20px;
}

/* Search */
.product-search{
    width:100%;
    max-width:760px;
    display:block;
    margin:20px auto;
    padding:15px 22px;
    border-radius:30px;
    border:2px solid #155a85;
    background:#102d4d;
    color:white;
    font-size:17px;
    text-align:center;
    outline:none;
}

.product-search:focus{
    border-color:#20b9ff;
    box-shadow:0 0 15px rgba(32,185,255,.25);
}

.product-search::placeholder{
    color:#a9bfd4;
}

/* Categories */
.category-filter{
    display:flex !important;
    justify-content:center !important;
    align-items:center;
    gap:10px !important;
    margin:18px auto 28px !important;
}

.filter-btn{
    padding:10px 20px !important;
    border:1px solid #155a85 !important;
    border-radius:25px !important;
    background:#0d2948 !important;
    color:#fff !important;
    font-size:15px;
    font-weight:600;
}

.filter-btn:hover,
.filter-btn.active{
    background:#079bea !important;
    border-color:#079bea !important;
}

/* Product grid - 2 columns */
.products-grid{
    display:grid !important;
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:22px !important;
    max-width:1000px;
    margin:0 auto;
}

/* Product card */
.product-card{
    background:#0b2340 !important;
    border:2px solid #155a85 !important;
    border-radius:20px !important;
    overflow:hidden;
    text-align:center;

    transition:.25s;

    border-color:#20b9ff !important;

    width:100% !important;

    background:#071a33 !important;
    overflow:hidden;
}

    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
    display:block;
}

.product-info{
    padding:18px 15px 20px !important;
    text-align:center !important;
}

.product-title{
    color:#fff !important;
    font-size:18px !important;
    font-weight:700;
    text-align:center !important;
    margin:8px 0 10px !important;
}

.rating{
    color:#fbbf24 !important;
    font-size:16px !important;
    text-align:center !important;
    margin-bottom:10px !important;
}

.price-box{
    color:#20b9ff !important;
    font-size:23px !important;
    font-weight:800;
    text-align:center !important;
    margin-bottom:15px !important;
}

.add-btn{
    background:#079bea !important;
    color:white !important;
    border:none !important;
    padding:13px 10px !important;
    border-radius:12px !important;
    font-size:15px !important;
    font-weight:700 !important;
    width:100% !important;

.add-btn:hover{
    background:#087fc4 !important;

/* Mobile */
@media(max-width:600px){
    header{
        padding:14px 10px;
        flex-direction:column;
        gap:12px;
    }

    header h1{
        font-size:28px;
    }

    nav{
        gap:10px;
    }

    nav a{
        font-size:13px;
    }

    .container{
        padding:0 12px;
        margin-top:20px;
    }

    h2{
        font-size:25px;
    }

    .products-grid{
        grid-template-columns:repeat(2,minmax(0,1fr)) !important;
        gap:12px !important;
    }

    .product-img{
        height:155px !important;
    }

    .product-info{
        padding:12px 8px 14px !important;
    }

    .product-title{
        font-size:15px !important;
    }

    .rating{
        font-size:14px !important;
    }

    .price-box{
        font-size:18px !important;
    }

    .add-btn{
        font-size:13px !important;
        padding:11px 5px !important;
    }

    .filter-btn{
        padding:8px 12px !important;
        font-size:13px;
    }

    .product-search{
        font-size:14px;
        padding:13px 15px;
    }
}
</style>

</head>
<body>
    <header>
        <h1>FA Digital Store</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart 🛒 <span class="cart-badge" id="cartCount">0</span></a>
        </nav>
    </header>

    <div class="container">
        <h2>All Products</h2>
        <p class="section-subtitle">Browse our complete collection</p>

<input
    type="search"
    id="productSearch"
    class="product-search"
    placeholder="🔍 Product search..."
    oninput="searchProducts(this.value)"
>

        <div class="category-filter" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0 30px;">
    <button onclick="filterProducts('All')" class="filter-btn active">All</button>
    <button onclick="filterProducts('Electronics')" class="filter-btn">Electronics</button>
    <button onclick="filterProducts('Men')" class="filter-btn">Men</button>
    <button onclick="filterProducts('Women')" class="filter-btn">Women</button>
    <button onclick="filterProducts('Kids')" class="filter-btn">Kids</button>
    <button onclick="filterProducts('Toys')" class="filter-btn">Toys</button>
</div>

<div class="products-grid" id="productsGrid">
        <div style="text-align:center;padding:40px;">Loading products...</div>
    </div>
    </div>

    <script>
        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
            document.getElementById('cartCount').innerText = totalQty;
        }

        function addToCart(name, price) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let existing = cart.find(item => item.title === name || item.name === name);
            if (existing) {
                existing.quantity = (parseInt(existing.quantity) || 1) + 1;
            } else {
                cart.push({ title: name, name: name, price: price, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            alert(`"${name}" added to cart! 🎉`);
        }

window.onload = updateCartBadge;
    
let allProducts = [];
let currentCategory = "All";

function searchProducts(query) {
    const q = String(query || "").trim().toLowerCase();

    const filtered = allProducts.filter(product => {
        const name = String(product.name || "").toLowerCase();
        const category = String(product.category || "").toLowerCase();
        const price = String(product.price || "").toLowerCase();

        const matchesSearch =
            !q ||
            name.includes(q) ||
            category.includes(q) ||
            price.includes(q);

        const matchesCategory =
            currentCategory === "All" ||
            product.category === currentCategory;

        return matchesSearch && matchesCategory;
    });

    renderProducts(filtered);
}

async function loadProducts() {
    const grid = document.getElementById("productsGrid");

    try {
        const response = await fetch("/api/products");

        if (!response.ok) {
            throw new Error("Failed to load products");
        }

        allProducts = await response.json();
        renderProducts(allProducts);
    } catch (error) {
        console.error("Product loading error:", error);
        grid.innerHTML =
            '<p style="text-align:center;">Unable to load products.</p>';
    }
}

function renderProducts(products) {
    const grid = document.getElementById("productsGrid");

    if (!products.length) {
        grid.innerHTML =
            '<p style="text-align:center;">No products found.</p>';
        return;
    }

    grid.innerHTML = products.map(product => `
        <div class="product-card">
            <div class="product-img">
                <img
                    src="${product.image || 'https://placehold.co/600x600/png?text=Product'}"
                    alt="${product.name || 'Product'}"
                    loading="lazy"
                    decoding="async"
                >
            </div>

            <div class="product-info">
                <h3 class="product-title">${product.name || "Product"}</h3>
                <div class="rating">⭐ 4.5</div>

                <div class="price-box">
                    <span class="price">
                        Rs. ${Number(product.price || 0).toLocaleString()}
                    </span>
                </div>

                <button
                    class="add-btn"
                    onclick='addToCart(${JSON.stringify(product.name || "Product")}, ${Number(product.price || 0)})'
                >
                    Add to Cart
                </button>
            </div>
        </div>
    `).join("");
}

function filterProducts(category) {
    currentCategory = category;

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.toggle(
            "active",
            btn.textContent.trim() === category
        );
    });

    const searchInput = document.querySelector(".product-search");
    searchProducts(searchInput ? searchInput.value : "");
}

loadProducts();
</script>
</body>
</html>
